[project]
name = "jobcopilot"
version = "0.1.0"
description = "Agentic job-hunt copilot: finds, scores and drafts"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "feedparser>=6.0",
  "typer>=0.12",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pytest-asyncio>=0.24"]

[project.scripts]
jobcopilot = "jobcopilot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
